[package]
name = "telemouse-analyze"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
rust-version.workspace = true

[lib]
name = "telemouse_analyze"
path = "src/lib.rs"

[[bin]]
name = "telemouse-analyze"
path = "src/main.rs"

# The packaged build is the default here too: `logging` is the only feature,
# and it buys exactly one thing — `core::logging::init`, and with it
# `tracing-subscriber`. Without it the crate still emits `tracing` events;
# nothing subscribes to them.
[features]
default = ["logging"]
logging = ["telemouse-core/logging"]

[dependencies]
telemouse-core = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[[bench]]
name = "hot_math"
harness = false

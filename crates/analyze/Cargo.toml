[package]
name = "telemouse-analyze"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
rust-version.workspace = true

[lib]
name = "telemouse_analyze"
path = "src/lib.rs"

[[bin]]
name = "telemouse-analyze"
path = "src/main.rs"

# The packaged build is the default here too: `logging` is the only feature,
# and it buys exactly one thing — `core::logging::init`, and with it
# `tracing-subscriber`. Without it the crate still emits `tracing` events;
# nothing subscribes to them.
[features]
default = ["logging"]
logging = ["telemouse-core/logging"]
# `quiet` compiles every `tracing` event out of a release build: all levels,
# `error!` and `warn!` included (debug builds keep them). Cargo unifies
# `tracing`'s features, so it applies to every binary built in the same cargo
# invocation, not only this one.
quiet = ["tracing/release_max_level_off"]

[dependencies]
telemouse-core = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true

[[bench]]
name = "hot_math"
harness = false

[package]
name = "telemouse-ctl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
rust-version.workspace = true

[[bin]]
name = "telemouse-ctl"
path = "src/main.rs"

# The developer build has everything; the minimal release zip is built with
# `--no-default-features --features quiet`. `logging` is the panel's own
# `ctl.log` plus one `<component>.log` per launched child (the in-memory log
# ring the page shows always exists); `observability` reads the capture
# agent's stats line into the card, the tray tooltip and `/api/state`, and
# watches the recording's size and the disk's free space.
[features]
default = ["logging", "observability"]
logging = ["telemouse-core/logging"]
observability = []
quiet = ["tracing/release_max_level_off"]

[dependencies]
telemouse-core = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
# This process spawns children and polls them: `process` is the point.
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "signal",
    "io-util",
    "time",
    "sync",
] }
axum = { version = "0.8.9" }

# The process table is read with a Toolhelp snapshot plus per-process
# queries for the few matching names (see procs.rs for why not sysinfo).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Wdk_System_Threading",
    # The tray icon and status window (gui/win.rs): a plain window with one
    # EDIT control, Shell_NotifyIcon, a popup menu, runtime-drawn icons, and
    # hiding the console window when this process is the only one on it.
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    # ShutdownBlockReasonCreate: hold a logoff/shutdown open while the
    # children flush their recordings.
    "Win32_System_Shutdown",
    # Per-monitor DPI awareness, so the status window is crisp on a scaled
    # display.
    "Win32_UI_HiDpi",
    # GetDiskFreeSpaceExW for the "GB free" reading on the capture card.
    "Win32_Storage_FileSystem",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

# Off Windows the same three calls go through sysinfo; capture is
# Windows-only, this just keeps `cargo test` portable.
[target.'cfg(not(windows))'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

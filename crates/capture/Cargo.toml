[package]
name = "telemouse-capture"
version.workspace = true
edition.workspace = true

[[bin]]
name = "telemouse"
path = "src/main.rs"

[dependencies]
telemouse-core = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rtrb = "0.4.0"
ctrlc = "3.5.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# zstd on the wire: at 1KHz these batches compress hard, and the BatchProducer
# needs `rt` on tokio for its linger tasks.
rskafka = { version = "0.6.0", features = ["compression-zstd"] }
tokio = { version = "1.53.1", features = ["rt", "time", "net", "sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

name: release

# Pushing a `v*` tag builds two flavours on Windows and attaches both to a
# GitHub Release for that tag. Release notes are the matching CHANGELOG.md
# section.
#
#   telemouse-vX.Y.Z-windows-x86_64.zip       minimal: capture, viz, control
#                                             panel; no logging, no Kafka, no
#                                             observability compiled in
#   telemouse-vX.Y.Z-windows-x86_64-full.zip  everything: the four binaries
#                                             with default features
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml is the single source of truth for the version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Tag matches Cargo.toml version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "tag v$tag but [workspace.package] version = $ver" }

      # The same gates as CI: a release is never cut from a tree CI rejects.
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (full)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (minimal)
        run: cargo clippy -p telemouse-capture -p telemouse-viz -p telemouse-ctl --all-targets --locked --no-default-features --features telemouse-capture/quiet,telemouse-viz/quiet,telemouse-ctl/quiet -- -D warnings
      - name: Test (full)
        run: cargo test --workspace --locked
      - name: Test (minimal)
        run: cargo test -p telemouse-core -p telemouse-capture -p telemouse-viz -p telemouse-ctl --locked --no-default-features

      - name: Build (full)
        run: cargo build --release --workspace --locked
      - name: Build (minimal)
        run: cargo build --release --locked -p telemouse-capture -p telemouse-viz -p telemouse-ctl --no-default-features --features telemouse-capture/quiet,telemouse-viz/quiet,telemouse-ctl/quiet --target-dir target/minimal

      - name: Package
        shell: pwsh
        run: |
          $base = "telemouse-${{ github.ref_name }}-windows-x86_64"
          # What every zip carries: the loopback sample as telemouse.toml
          # (never the repository's own dev config), the license, the
          # user-facing docs (guide, conventions, fair-play statement, API
          # reference), the plan the GUIDE links to, and the demo recording
          # the README tells people to try first. Audit notes stay out.
          function Common($dir) {
            New-Item -ItemType Directory "$dir/docs", "$dir/recordings" | Out-Null
            Copy-Item telemouse.example.toml "$dir/telemouse.toml"
            Copy-Item LICENSE, README.md, CHANGELOG.md, mouse-telemetry-plan.md $dir
            Copy-Item docs/GUIDE.md, docs/CONVENTIONS.md, docs/FAIR-PLAY.md, docs/API.md "$dir/docs"
            Copy-Item recordings/demo-session.jsonl "$dir/recordings"
          }
          function Zip($dir) {
            Compress-Archive -Path $dir -DestinationPath "$dir.zip"
            Get-FileHash "$dir.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $dir.zip" } | Set-Content "$dir.zip.sha256"
          }
          $min = $base
          New-Item -ItemType Directory $min | Out-Null
          Copy-Item target/minimal/release/telemouse.exe, target/minimal/release/telemouse-viz.exe, target/minimal/release/telemouse-ctl.exe $min
          Common $min
          Zip $min
          $full = "$base-full"
          New-Item -ItemType Directory $full | Out-Null
          Copy-Item target/release/telemouse.exe, target/release/telemouse-viz.exe, target/release/telemouse-analyze.exe, target/release/telemouse-ctl.exe $full
          Common $full
          Zip $full

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($ver))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no '## [$ver]' section" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $body = if ($end -gt 1) { $rest[0..($end - 2)] } elseif ($end -eq 1) { @() } else { $rest }
          $body | Set-Content notes.md

      # A signed statement that these exact zips were built by this workflow
      # from this commit: the trust signal that stands in for a code
      # signature until the binaries are signed.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            telemouse-${{ github.ref_name }}-windows-x86_64.zip
            telemouse-${{ github.ref_name }}-windows-x86_64-full.zip

      - uses: softprops/action-gh-release@v2
        with:
          name: telemouse ${{ github.ref_name }}
          body_path: notes.md
          files: |
            telemouse-${{ github.ref_name }}-windows-x86_64.zip
            telemouse-${{ github.ref_name }}-windows-x86_64.zip.sha256
            telemouse-${{ github.ref_name }}-windows-x86_64-full.zip
            telemouse-${{ github.ref_name }}-windows-x86_64-full.zip.sha256

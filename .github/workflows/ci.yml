name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only token: CI only checks out and builds.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A failing test prints where it panicked.
  RUST_BACKTRACE: 1

# Every `uses:` is pinned to a commit SHA (the tag in the trailing comment);
# .github/dependabot.yml keeps the pins current.
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # rust-toolchain.toml is the single source of truth for the version and
      # components: with no argument rustup installs exactly what it names, so
      # a newer stable can never turn the lint gate red on its own.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (full, default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The minimal flavour (no logging, no Kafka, no observability) is no
      # longer published, only documented as a build-it-yourself option
      # (docs/DEVELOPING.md). These two steps keep its feature flags working
      # for every crate.
      - name: clippy (minimal)
        run: cargo clippy -p telemouse-core -p telemouse-capture -p telemouse-viz -p telemouse-analyze -p telemouse-ctl -p telemouse-mcp --all-targets --locked --no-default-features --features telemouse-capture/quiet,telemouse-viz/quiet,telemouse-analyze/quiet,telemouse-ctl/quiet,telemouse-mcp/quiet -- -D warnings
      - name: test (full)
        run: cargo test --workspace --locked
      - name: test (minimal)
        run: cargo test -p telemouse-core -p telemouse-capture -p telemouse-viz -p telemouse-analyze -p telemouse-ctl -p telemouse-mcp --locked --no-default-features
      # The viz and ctl page scripts are embedded in the binaries; the Rust
      # tests run these when node is present, and this makes the requirement
      # explicit.
      - name: viz page syntax
        run: node --check crates/viz/src/app.js
      - name: viz engine tests
        run: node --test "crates/viz/js-tests/*.test.mjs"
      - name: ctl page syntax
        run: node --check crates/ctl/src/panel.js
      - name: ctl page tests
        run: node --test "crates/ctl/js-tests/*.test.mjs"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # audit-check@v2 still targets Node 20; run RustSec's CLI directly.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit

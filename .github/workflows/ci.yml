name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # ctl's child-process tests spawn cmd.exe; capture is Windows-only.
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # rust-toolchain.toml is the single source of truth for the version;
      # the explicit input keeps the action from ever picking a newer stable
      # whose lints would turn the gate red on their own.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (full, default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The minimal flavour (no logging, no Kafka, no observability) is no
      # longer published, only documented as a build-it-yourself option
      # (docs/DEVELOPING.md). These two steps keep its feature flags working.
      - name: clippy (minimal)
        run: cargo clippy -p telemouse-capture -p telemouse-viz -p telemouse-ctl -p telemouse-mcp --all-targets --locked --no-default-features --features telemouse-capture/quiet,telemouse-viz/quiet,telemouse-ctl/quiet,telemouse-mcp/quiet -- -D warnings
      - name: test (full)
        run: cargo test --workspace --locked
      - name: test (minimal)
        run: cargo test -p telemouse-core -p telemouse-capture -p telemouse-viz -p telemouse-ctl -p telemouse-mcp --locked --no-default-features
      # The viz page's script is embedded in the binary; the Rust tests run
      # these when node is present, and this makes the requirement explicit.
      - name: viz page syntax
        run: node --check crates/viz/src/app.js
      - name: viz engine tests
        run: node --test "crates/viz/js-tests/*.test.mjs"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      # audit-check@v2 still targets Node 20; run RustSec's CLI directly.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit

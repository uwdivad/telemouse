[package]
name = "tmbench"
version = "0.2.0"
edition = "2021"

[workspace]

[dependencies]
tungstenite = "0.26"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_WindowsProgramming",
] }

[profile.release]
opt-level = 3

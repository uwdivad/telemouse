# telemouse configuration — all fields optional, defaults shown/commented.
#
# This is the development machine's config (LAN viz bind, Kafka on, its own
# broker addresses). The sample that ships with releases is
# telemouse.example.toml, which keeps everything on loopback.
#
# Relative paths (recording.dir, ctl.log_dir, ctl.bin_dir) are resolved
# against this file's own directory, not the working directory of whatever
# started the process.

# Your mouse's real CPI (a.k.a. DPI). Used by consumers to derive physical cm.
mouse_cpi = 1600.0

[batch]
# Batch window: the live-viz latency floor and the batches/s every hop pays
# for (~150us of kernel CPU per batch across capture, bridge and each
# browser). 25 = 40 batches/s for responsive live visualization; use 50 to
# halve that per-batch CPU cost. Recordings and analysis are unchanged.
window_ms = 25
max_events = 448
ring_capacity = 65536
# Raw-input reads are batched: the capture thread wakes on the first report
# of a burst, then drains the queue every (coalesce_ms + 1) ms on a timer for
# as long as reports keep coming. Being woken by the queue costs Windows
# ~25-30us of kernel CPU per wake, so at 1kHz: 2 = ~0.45% of a core, 8 =
# ~0.22%. Only a burst's first report has an observed arrival; the rest are
# spaced by the estimated report interval (exact to about this many ms).
# 0 = one read per report, exact stamps, ~2.8% of a core. Max 10.
coalesce_ms = 8

[udp]
enabled = true
addr = "127.0.0.1:7878"

[kafka]
# Local broker: `docker compose up -d` (see compose.yaml). UDP + local recording
# always work; if the broker is down capture warns and runs without Kafka.
enabled = true
# Every entry needs a port: the client connects with the string as written.
brokers = ["127.0.0.1:9092", "192.168.137.67:9092", "192.168.1.188:9092"]

[recording]
enabled = true
dir = "recordings"

[viz]
# 0.0.0.0 = every interface, so an OBS browser source on another PC on the
# LAN can load http://<this PC's IP>:7879/obs (see the [viz.obs] note below).
# A peer that is not this machine gets /obs and its live socket only; the
# dashboard and the recordings stay on this machine. There is still no login
# on the live stream, so keep it to a trusted network (Windows Firewall:
# allow TCP 7879 inbound on the Private profile only). Set it back to
# "127.0.0.1:7879" to keep the viz to this machine.
http_addr = "0.0.0.0:7879"

# Control panel (telemouse-ctl): start/stop the components above, run the
# tools, see and kill telemouse processes. It can terminate processes, so
# keep it on loopback.
[ctl]
http_addr = "127.0.0.1:7880"
# Where the telemouse binaries are. Unset = next to telemouse-ctl, then PATH.
# bin_dir = "target/release"
# A graceful stop sends Ctrl-Break and waits this long before terminating.
# The agent's shutdown drains its recording and Kafka queues, up to 3 s each
# when storage or the broker is slow; keep this above their sum.
stop_grace_secs = 8
# ctl.log (the panel's own log; its console is hidden when started from
# Explorer) and one <component>.log per launched component go here.
log_dir = "logs"
# System-wide hotkey (needs the tray) that starts a new saved session: stops
# the capture agent if it is running, then starts one that records — a fresh
# recordings/<session>.jsonl, whatever [recording] enabled says. Works from
# inside a game. Modifiers ctrl/alt/shift/win + a letter, digit, f1-f24 or a
# named key (space, pause, numpad0, …); "" for none.
hotkey = "ctrl+alt+r"

# OBS browser source: add http://127.0.0.1:7879/obs as a Browser source. From
# OBS on another PC use this machine's LAN IP instead (`ipconfig` → IPv4
# Address, e.g. http://192.168.1.168:7879/obs); it has to be the IP literal,
# a hostname like http://GAMING-PC:7879 is refused (DNS-rebinding guard).
# These are the defaults; any of them can be overridden per source with URL
# query parameters, e.g. /obs?layout=aim&hud=speed,aim&scale=1.5&bg=0e131c80
[viz.obs]
layout = "split"            # split | stack | desk | aim
background = "transparent"  # or "#rrggbb" / "#rrggbbaa"
hud = ["speed", "aim", "cpm"]  # also: eps, dist, aimdist, clicks, game, latency; [] hides it
hud_position = "bottom-left"
scale = 1.0                 # stroke/marker/HUD size multiplier for small sources
trail_secs = 3.0
buffer_ms = 35
grid = true
legend = false
labels = false
# Seconds without a batch before the overlay says there is no feed; 0 = off.
stale_secs = 3.0

# Per-game aim conversion: degrees = counts * sens * coeff.
# Key = lowercase process name.
[games."cs2.exe"]
sens = 1.0
yaw_coeff = 0.022
pitch_coeff = 0.022

# Call of Duty via the CoD HQ launcher (MW2/MW3/Warzone). MW2019 standalone
# was "modernwarfare.exe" — copy this block under that key if you play it.
# Modern CoD is 0.0066 deg/count at sens 1 (a third of Source's 0.022, hence
# the "CS sens x 3.33" folk conversion). The coefficients are plain config —
# adjust them here if your setup warrants it; with legacy ADS (no separate
# ADS multiplier) one coefficient covers the whole session.
[games."cod.exe"]
sens = 12.5          # set to your in-game sensitivity
yaw_coeff = 0.0066
pitch_coeff = 0.0066

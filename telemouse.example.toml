# telemouse configuration — the sample shipped with every release.
#
# This is `telemouse.toml` next to the binaries: the release zip ships it
# under that name, and `telemouse-ctl` writes it there on first start when
# none exists. Every field is optional; the values below are the defaults,
# apart from the two example [games] entries — a test in telemouse-core
# compares this file against them field by field, so it cannot drift. The
# defaults are chosen so a fresh install talks to nobody but itself: both
# servers on loopback, no Kafka. Set `mouse_cpi` and your games;
# `telemouse doctor` prints the resolved configuration.
#
# Relative paths (recording.dir, ctl.log_dir, ctl.bin_dir) are resolved
# against this file's own directory, not the working directory of whatever
# started the process.

# Your mouse's real CPI (a.k.a. DPI). Used by consumers to derive physical cm.
mouse_cpi = 1600.0

# System-wide hotkey that drops a marker into the recording ("clutch", "round
# start"...). Windows hands a registered chord to telemouse before the game
# sees it, so pick one the game does not use. Same grammar as [ctl] hotkey
# (modifiers ctrl/alt/shift/win + a key; function keys may stand alone), and
# it must differ from it; "" for none.
marker_hotkey = "f9"

[batch]
# Batch window: the live-viz latency floor and the batches/s every hop pays
# for (~150us of kernel CPU per batch across capture, bridge and each
# browser). 25 = 40 batches/s for responsive live visualization; use 50 to
# halve that per-batch CPU cost. Recordings and analysis are unchanged.
window_ms = 25              # max 1000
max_events = 448
ring_capacity = 65536       # max 4194304
# Raw-input reads are batched: the capture thread wakes on the first report
# of a burst, then drains the queue every (coalesce_ms + 1) ms on a timer for
# as long as reports keep coming. 0 = one read per report, exact stamps,
# ~2.8% of a core; 8 = ~0.22%. Max 10.
coalesce_ms = 8

[udp]
enabled = true
addr = "127.0.0.1:7878"

[kafka]
# Off by default. A local broker ships as compose.yaml (`docker compose up
# -d`); set `enabled = true` to produce to it. Every broker needs a port.
# UDP + the local recording always work; if the broker is down capture warns
# and runs without Kafka.
enabled = false
brokers = ["127.0.0.1:9092"]

[recording]
enabled = true
dir = "recordings"

[viz]
# Loopback: only this machine can open the dashboard, the OBS overlay and
# the recordings. To load the OBS overlay from a second PC on your LAN, bind
# "0.0.0.0:7879" instead — that PC then gets /obs and its live socket, and
# nothing else (the dashboard and recordings stay on this machine) — and
# allow TCP 7879 inbound on the Private firewall profile. The live stream
# has no login: keep it to a network you trust.
http_addr = "127.0.0.1:7879"

# Control panel (telemouse-ctl): start/stop the components above, run the
# tools, see and kill telemouse processes. It can terminate processes, so
# keep it on loopback.
[ctl]
http_addr = "127.0.0.1:7880"
# Where the telemouse binaries are. Unset = next to telemouse-ctl, then PATH.
# bin_dir = "target/release"
# A graceful stop sends Ctrl-Break and waits this long before terminating.
# The agent's shutdown drains its recording and Kafka queues, up to 3 s each
# when storage or the broker is slow; keep this above their sum.
stop_grace_secs = 8
# ctl.log (the panel's own log; its console is hidden when started from
# Explorer) and one <component>.log per launched component go here.
log_dir = "logs"
# System-wide hotkey (needs the tray) that starts a new saved session: stops
# the capture agent if it is running, then starts one that records — a fresh
# recordings/<session>.jsonl, whatever [recording] enabled says. Works from
# inside a game. Modifiers ctrl/alt/shift/win + a letter, digit, f1-f24 or a
# named key (space, pause, numpad0, …); "" for none.
hotkey = "ctrl+alt+r"

# OBS browser source: add http://127.0.0.1:7879/obs as a Browser source.
# These are the defaults; any of them can be overridden per source with URL
# query parameters, e.g. /obs?layout=aim&hud=speed,aim&scale=1.5&bg=0e131c80
[viz.obs]
layout = "split"            # split | stack | desk | aim
background = "transparent"  # or "#rrggbb" / "#rrggbbaa"
hud = ["speed", "aim", "cpm"]  # also: eps, dist, aimdist, clicks, game, latency, eventage; [] hides it
hud_position = "bottom-left"
scale = 1.0                 # stroke/marker/HUD size multiplier for small sources
trail_secs = 3.0
buffer_ms = 35
grid = true
legend = false
labels = false
# Seconds without a batch before the overlay stops saying nothing; 0 = off.
# Past it it shows "idle" while the capture agent's heartbeat keeps arriving
# (a still hand), and dims to "no feed" only once that stops as well.
stale_secs = 3.0

# Per-game aim conversion: degrees = counts * sens * coeff.
# Key = lowercase process name of the game (matched automatically).
[games."cs2.exe"]
sens = 1.0
yaw_coeff = 0.022           # Source/Quake/Apex: 0.022
pitch_coeff = 0.022

# Call of Duty via the CoD HQ launcher (MW2/MW3/Warzone). Modern CoD is
# 0.0066 deg/count at sens 1 (a third of Source's 0.022); Overwatch is the
# same; Valorant is 0.07. Set `sens` to your in-game sensitivity.
[games."cod.exe"]
sens = 1.0
yaw_coeff = 0.0066
pitch_coeff = 0.0066

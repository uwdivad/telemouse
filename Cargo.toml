[workspace]
resolver = "3"
members = ["crates/core", "crates/capture", "crates/viz", "crates/analyze"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
telemouse-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Release-speed build with symbols, for flamegraphs/profilers.
[profile.profiling]
inherits = "release"
debug = true

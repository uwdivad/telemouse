[workspace]
resolver = "3"
members = ["crates/core", "crates/capture", "crates/viz", "crates/analyze", "crates/ctl"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/uwdivad/telemouse"
description = "Raw mouse telemetry for gaming: HID deltas with microsecond timestamps, live visualization, OBS overlay, recordings and aim metrics"
# The pinned toolchain (rust-toolchain.toml); clippy checks the code against
# this, so it is the version the code actually needs, not the edition's floor.
rust-version = "1.98"

[workspace.dependencies]
telemouse-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# Profile notes (2026-08 perf audit):
# - lto stays "thin": a fat-LTO/panic=abort evaluation came out net-negative
#   for this syscall-dominated workload, so neither is used here.
# - panic stays "unwind": ordered teardown depends on it (partial-batch flush,
#   bounded Kafka drain on shutdown).
# - `-C target-cpu=znver3` is a worthwhile OPT-IN for telemouse-analyze math
#   kernels on the 5950X, e.g.
#     $env:RUSTFLAGS="-C target-cpu=znver3"; cargo bench -p telemouse-analyze
#   It is deliberately not forced workspace-wide so binaries stay portable.
[profile.release]
lto = "thin"
codegen-units = 1

# Release-speed build with symbols, for flamegraphs/profilers.
[profile.profiling]
inherits = "release"
debug = true
